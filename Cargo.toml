[workspace]
members = [
    "crates/ia-core",
    "crates/live-channel",
    "crates/ibcs",
    "crates/argus-examples",
    "crates/sigma-bridge",
]
# `crates/warp` temporarily excluded: depends on `dmpierre/ark-codes` which has no
# ark-* 0.6 fork. Re-add once ark-codes is bumped (see codec-ownership-correction
# wiki note, PR 2 blockers).
exclude = ["crates/warp"]
resolver = "2"

[workspace.dependencies]
ark-ff = "0.6.0"
ark-ec = "0.6.0"
ark-serialize = "0.6.0"
ark-std = "0.6.0"
ark-poly = "0.6.0"
ark-bls12-381 = "0.6.0"
ark-curve25519 = "0.6.0"
ark-relations = "0.6.0"
ark-r1cs-std = "0.6.0"
ark-crypto-primitives = { version = "0.6.0", features = ["merkle_tree", "crh", "constraints", "sponge"] }
ark-codes = { git = "https://github.com/dmpierre/ark-codes.git" }
spongefish = { version = "0.7.0", features = ["keccak", "derive"] }
spongefish-dsfs = { version = "0.7.0" }
thiserror = "2.0"
rayon = "1.11"
blake3 = "1.5"

[patch.crates-io]
ark-crypto-primitives = { git = "https://github.com/arkworks-rs/crypto-primitives.git", branch = "release/0.6.0" }
spongefish = { path = "../spongefish/spongefish" }
spongefish-dsfs = { path = "../spongefish/spongefish-dsfs" }
