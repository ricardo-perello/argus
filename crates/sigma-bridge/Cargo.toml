[package]
name = "sigma-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sigma-protocol → Interactive-Argument bridge via Argus DSFS pipeline"

[dependencies]
ia-core = { path = "../ia-core" }
spongefish.workspace = true
spongefish-dsfs.workspace = true
sha3 = "0.10"
sigma-proofs = { git = "https://github.com/ricardo-perello/sigma-proofs.git", branch = "main", default-features = false }
rand_chacha = { version = "0.3", default-features = false }

[[example]]
name = "update_keccak_vectors"

[dev-dependencies]
bls12_381 = { version = "0.8", default-features = false, features = ["groups"] }
curve25519-dalek = { version = "4", default-features = false, features = ["alloc", "group"] }
ff = "0.13"
group = "0.13"
hex = "0.4"
p256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
rand_chacha = "0.3"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["hex"] }
sigma-proofs = { git = "https://github.com/ricardo-perello/sigma-proofs.git", branch = "main", features = ["bls12_381", "p256", "curve25519-dalek", "std"] }
